name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [host, images, bios-chain]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Build test environment
        uses: docker/build-push-action@v7
        with:
          context: tests
          file: tests/Dockerfile
          target: host
          platforms: linux/amd64
          load: true
          tags: hackos-tests:host
          cache-from: type=gha,scope=tests-host-${{ matrix.suite }}
          cache-to: type=gha,mode=max,scope=tests-host-${{ matrix.suite }}
      - name: Run tests
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          mkdir -p tests/out
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD,target=/work,readonly" \
            --mount "type=bind,source=$PWD/tests/out,target=/work/tests/out" \
            hackos-tests:host python3 tests/run.py "$SUITE"
      - name: Check debugger runner and timeout detection
        if: matrix.suite == 'bios-chain'
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD,target=/work,readonly" \
            --mount "type=bind,source=$PWD/tests/out,target=/work/tests/out" \
            hackos-tests:host python3 tests/qemu_boot.py --self-test
      - name: Exercise filter programs with sanitized syscall adapters
        if: ${{ !cancelled() && matrix.suite == 'host' }}
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD,target=/work,readonly" \
            --mount "type=bind,source=$PWD/tests/out,target=/work/tests/out" \
            hackos-tests:host python3 tests/filter_commands.py
      - name: Exercise boot FAT32 and shared ELF validation with sanitizers
        if: ${{ !cancelled() && matrix.suite == 'host' }}
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD,target=/work,readonly" \
            --mount "type=bind,source=$PWD/tests/out,target=/work/tests/out" \
            hackos-tests:host python3 tests/boot_loader.py
      - name: Exercise Ethernet and ARP codec with sanitizers
        if: ${{ !cancelled() && matrix.suite == 'host' }}
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD,target=/work,readonly" \
            --mount "type=bind,source=$PWD/tests/out,target=/work/tests/out" \
            hackos-tests:host python3 tests/network.py
      - name: Exercise HTTP URL and response decoder with sanitizers
        if: ${{ !cancelled() && matrix.suite == 'host' }}
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD,target=/work,readonly" \
            --mount "type=bind,source=$PWD/tests/out,target=/work/tests/out" \
            hackos-tests:host python3 tests/http.py
      - name: Exercise bounded HTML parsing and layout
        if: ${{ !cancelled() && matrix.suite == 'host' }}
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD,target=/work,readonly" \
            hackos-tests:host python3 tests/html.py
      - name: Exercise surface allocation with sanitizers
        if: ${{ !cancelled() && matrix.suite == 'host' }}
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD,target=/work,readonly" \
            --mount "type=bind,source=$PWD/tests/out,target=/work/tests/out" \
            hackos-tests:host python3 tests/surface_allocator.py
      - name: Exercise keyboard decoders with native sanitizers
        if: ${{ !cancelled() && matrix.suite == 'host' }}
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD,target=/work,readonly" \
            --mount "type=bind,source=$PWD/tests/out,target=/work/tests/out" \
            hackos-tests:host python3 tests/gui_keyboard.py
      - name: Exercise userspace GUI library with native sanitizers
        if: ${{ !cancelled() && matrix.suite == 'host' }}
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD,target=/work,readonly" \
            --mount "type=bind,source=$PWD/tests/out,target=/work/tests/out" \
            hackos-tests:host python3 tests/gui_library.py
      - name: Exercise userspace printf formatting with native sanitizers
        if: ${{ !cancelled() && matrix.suite == 'host' }}
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD,target=/work,readonly" \
            --mount "type=bind,source=$PWD/tests/out,target=/work/tests/out" \
            hackos-tests:host python3 tests/formatting.py
      - name: Summarize results
        if: always()
        run: python3 tests/summarize.py >> "$GITHUB_STEP_SUMMARY"
      - name: Upload diagnostics and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-${{ matrix.suite }}
          retention-days: 14
          path: |
            tests/out/${{ matrix.suite }}/
            tests/out/qemu-harness/
            tests/out/filter-commands/
            tests/out/boot-loader/
            tests/out/surface-allocator/
            tests/out/gui-keyboard/
            tests/out/gui-library/
            tests/out/formatting/
            !tests/out/**/*.o

  firmware:
    name: Build and boot ${{ matrix.firmware }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        firmware: [bios, uefi]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Build cross-toolchain environment
        uses: docker/build-push-action@v7
        with:
          context: tests
          file: tests/Dockerfile
          target: toolchain
          platforms: linux/amd64
          load: true
          tags: hackos-tests:toolchain
          cache-from: type=gha,scope=tests-toolchain-${{ matrix.firmware }}
          cache-to: type=gha,mode=max,scope=tests-toolchain-${{ matrix.firmware }}
      - name: Build fresh image and check layout
        id: build
        env:
          FIRMWARE: ${{ matrix.firmware }}
        run: |
          mkdir -p tests/out
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD,target=/work,readonly" \
            --mount "type=bind,source=$PWD/tests/out,target=/work/tests/out" \
            hackos-tests:toolchain python3 tests/build_images.py --firmware "$FIRMWARE"
      - name: Check public parallel build and Compose configuration
        env:
          FIRMWARE: ${{ matrix.firmware }}
        run: |
          docker compose config --quiet
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD,target=/work,readonly" \
            --mount "type=bind,source=$PWD/tests/out,target=/work/tests/out" \
            hackos-tests:toolchain python3 tools/build.py --firmware "$FIRMWARE" --output tests/out/portable-build
      - name: Observe kernel and timer milestones
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' }}
        env:
          FIRMWARE: ${{ matrix.firmware }}
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD,target=/work,readonly" \
            --mount "type=bind,source=$PWD/tests/out,target=/work/tests/out" \
            hackos-tests:toolchain python3 tests/qemu_boot.py --firmware "$FIRMWARE"
      - name: Boot a large fragmented kernel and reject malformed files
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FIRMWARE: ${{ matrix.firmware }}
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD,target=/work,readonly" \
            --mount "type=bind,source=$PWD/tests/out,target=/work/tests/out" \
            hackos-tests:toolchain python3 tests/qemu_loader.py --firmware "$FIRMWARE"
      - name: Exercise Ethernet packet exchange and NIC failure paths
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FIRMWARE: ${{ matrix.firmware }}
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD,target=/work,readonly" \
            --mount "type=bind,source=$PWD/tests/out,target=/work/tests/out" \
            hackos-tests:toolchain python3 tests/qemu_network.py --firmware "$FIRMWARE" \
              --image "tests/out/build-$FIRMWARE/HackOS.img"
      - name: Exercise the visible network demo and hardware ABI
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FIRMWARE: ${{ matrix.firmware }}
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD,target=/work,readonly" \
            --mount "type=bind,source=$PWD/tests/out,target=/work/tests/out" \
            hackos-tests:toolchain python3 tests/qemu_network_demo.py --firmware "$FIRMWARE" \
              --image "tests/out/build-$FIRMWARE/HackOS.img"
      - name: Exercise static routing and ICMP failures
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FIRMWARE: ${{ matrix.firmware }}
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD,target=/work,readonly" \
            --mount "type=bind,source=$PWD/tests/out,target=/work/tests/out" \
            hackos-tests:toolchain python3 tests/qemu_routing.py --firmware "$FIRMWARE" \
              --image "tests/out/build-$FIRMWARE/HackOS.img"
      - name: Exercise DNS and hostname ping
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FIRMWARE: ${{ matrix.firmware }}
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD,target=/work,readonly" \
            --mount "type=bind,source=$PWD/tests/out,target=/work/tests/out" \
            hackos-tests:toolchain python3 tests/qemu_dns.py --firmware "$FIRMWARE" \
              --image "tests/out/build-$FIRMWARE/HackOS.img"
      - name: Exercise connected UDP endpoints and host echo
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FIRMWARE: ${{ matrix.firmware }}
        run: |
          for MODE in "" "--host-echo"; do
            docker run --rm --network none --user "$(id -u):$(id -g)" \
              --mount "type=bind,source=$PWD,target=/work,readonly" \
              --mount "type=bind,source=$PWD/tests/out,target=/work/tests/out" \
              hackos-tests:toolchain python3 tests/qemu_udp.py --firmware "$FIRMWARE" \
                --image "tests/out/build-$FIRMWARE/HackOS.img" $MODE
          done
      - name: Exercise TCP exchanges and host echo
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FIRMWARE: ${{ matrix.firmware }}
        run: |
          for MODE in "" "--host-echo"; do
            docker run --rm --network none --user "$(id -u):$(id -g)" \
              --mount "type=bind,source=$PWD,target=/work,readonly" \
              --mount "type=bind,source=$PWD/tests/out,target=/work/tests/out" \
              hackos-tests:toolchain python3 tests/qemu_tcp.py --firmware "$FIRMWARE" \
                --image "tests/out/build-$FIRMWARE/HackOS.img" $MODE
          done
      - name: Exercise TCP streams, readiness and host echo
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FIRMWARE: ${{ matrix.firmware }}
        run: |
          for MODE in "" "--host-echo"; do
            docker run --rm --network none --user "$(id -u):$(id -g)" \
              --mount "type=bind,source=$PWD,target=/work,readonly" \
              --mount "type=bind,source=$PWD/tests/out,target=/work/tests/out" \
              hackos-tests:toolchain python3 tests/qemu_tcp_stream.py --firmware "$FIRMWARE" \
                --image "tests/out/build-$FIRMWARE/HackOS.img" $MODE
          done
      - name: Exercise HTTP framing and downloads
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FIRMWARE: ${{ matrix.firmware }}
        run: |
          for MODE in "" "--host"; do
            docker run --rm --network none --user "$(id -u):$(id -g)" \
              --mount "type=bind,source=$PWD,target=/work,readonly" \
              --mount "type=bind,source=$PWD/tests/out,target=/work/tests/out" \
              hackos-tests:toolchain python3 tests/qemu_http.py --firmware "$FIRMWARE" \
                --image "tests/out/build-$FIRMWARE/HackOS.img" $MODE
          done
      - name: Exercise minimal browser navigation and rendering
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FIRMWARE: ${{ matrix.firmware }}
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD,target=/work,readonly" \
            --mount "type=bind,source=$PWD/tests/out,target=/work/tests/out" \
            hackos-tests:toolchain python3 tests/qemu_browser.py --firmware "$FIRMWARE" \
              --image "tests/out/build-$FIRMWARE/HackOS.img"
      - name: Exercise DHCP lease lifecycle
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FIRMWARE: ${{ matrix.firmware }}
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD,target=/work,readonly" \
            --mount "type=bind,source=$PWD/tests/out,target=/work/tests/out" \
            hackos-tests:toolchain python3 tests/qemu_dhcp.py --firmware "$FIRMWARE" \
              --image "tests/out/build-$FIRMWARE/HackOS.img"
      - name: Exercise persistent accounts, setup and login
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FIRMWARE: ${{ matrix.firmware }}
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD,target=/work,readonly" \
            --mount "type=bind,source=$PWD/tests/out,target=/work/tests/out" \
            hackos-tests:toolchain python3 tests/qemu_accounts.py --firmware "$FIRMWARE"
      - name: Exercise interactive shell and task lifecycle
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FIRMWARE: ${{ matrix.firmware }}
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD,target=/work,readonly" \
            --mount "type=bind,source=$PWD/tests/out,target=/work/tests/out" \
            hackos-tests:toolchain python3 tests/qemu_shell.py --firmware "$FIRMWARE"
      - name: Exercise blocking input, job control, heap and completion
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FIRMWARE: ${{ matrix.firmware }}
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD,target=/work,readonly" \
            --mount "type=bind,source=$PWD/tests/out,target=/work/tests/out" \
            hackos-tests:toolchain python3 tests/qemu_usability.py --firmware "$FIRMWARE"
      - name: Exercise streams, pipelines, deadlines and serial logging
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FIRMWARE: ${{ matrix.firmware }}
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD,target=/work,readonly" \
            --mount "type=bind,source=$PWD/tests/out,target=/work/tests/out" \
            hackos-tests:toolchain python3 tests/qemu_streams.py --firmware "$FIRMWARE"
      - name: Exercise clock, echo and hardware reports
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FIRMWARE: ${{ matrix.firmware }}
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD,target=/work,readonly" \
            --mount "type=bind,source=$PWD/tests/out,target=/work/tests/out" \
            hackos-tests:toolchain python3 tests/qemu_utilities.py --firmware "$FIRMWARE"
      - name: Exercise normal-user filters and pipeline paging
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FIRMWARE: ${{ matrix.firmware }}
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD,target=/work,readonly" \
            --mount "type=bind,source=$PWD/tests/out,target=/work/tests/out" \
            hackos-tests:toolchain python3 tests/qemu_filters.py --firmware "$FIRMWARE"
      - name: Exercise normal-user sort, uniq, cut and tr
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FIRMWARE: ${{ matrix.firmware }}
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" \
