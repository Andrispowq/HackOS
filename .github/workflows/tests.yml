        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD,target=/work,readonly" \
            --mount "type=bind,source=$PWD/tests/out,target=/work/tests/out" \
            hackos-tests:toolchain python3 tests/qemu_files_gui.py --firmware "$FIRMWARE"
      - name: Exercise graphical editor
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' }}
        env:
          FIRMWARE: ${{ matrix.firmware }}
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD,target=/work,readonly" \
            --mount "type=bind,source=$PWD/tests/out,target=/work/tests/out" \
            hackos-tests:toolchain python3 tests/qemu_editor.py --firmware "$FIRMWARE"
      - name: Exercise graphical settings and account management
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' }}
        env:
          FIRMWARE: ${{ matrix.firmware }}
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD,target=/work,readonly" \
            --mount "type=bind,source=$PWD/tests/out,target=/work/tests/out" \
            hackos-tests:toolchain python3 tests/qemu_settings.py --firmware "$FIRMWARE"
      - name: Exercise padded console tables and printf
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' }}
        env:
          FIRMWARE: ${{ matrix.firmware }}
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD,target=/work,readonly" \
            --mount "type=bind,source=$PWD/tests/out,target=/work/tests/out" \
            hackos-tests:toolchain python3 tests/qemu_formatting.py --firmware "$FIRMWARE"
      - name: Summarize results
        if: always()
        run: python3 tests/summarize.py >> "$GITHUB_STEP_SUMMARY"
      - name: Upload build and boot diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-${{ matrix.firmware }}
          retention-days: 14
          path: |
            tests/out/build-${{ matrix.firmware }}/*.log
            tests/out/build-${{ matrix.firmware }}/*.txt
            tests/out/build-${{ matrix.firmware }}/*.json
            tests/out/build-${{ matrix.firmware }}/*.xml
            tests/out/build-${{ matrix.firmware }}/*.elf
            tests/out/build-${{ matrix.firmware }}/*.img
            tests/out/build-${{ matrix.firmware }}/source/**/*.elf
            tests/out/build-${{ matrix.firmware }}/source/bin/*.img
            tests/out/qemu-${{ matrix.firmware }}/
            tests/out/qemu-loader-${{ matrix.firmware }}/
            tests/out/qemu-accounts-${{ matrix.firmware }}/
            tests/out/qemu-shell-${{ matrix.firmware }}/
            tests/out/qemu-usability-${{ matrix.firmware }}/
            tests/out/qemu-streams-${{ matrix.firmware }}/
            tests/out/qemu-utilities-${{ matrix.firmware }}/
            tests/out/qemu-filters-${{ matrix.firmware }}/
            tests/out/qemu-text-tools-${{ matrix.firmware }}/
            tests/out/qemu-files-${{ matrix.firmware }}/
            tests/out/qemu-storage-${{ matrix.firmware }}/
            tests/out/qemu-user-${{ matrix.firmware }}/
            tests/out/qemu-windows-${{ matrix.firmware }}/
            tests/out/qemu-desktop-${{ matrix.firmware }}/
            tests/out/qemu-login-gui-${{ matrix.firmware }}/
            tests/out/qemu-files-gui-${{ matrix.firmware }}/
            tests/out/qemu-editor-${{ matrix.firmware }}/
            tests/out/qemu-settings-${{ matrix.firmware }}/
            tests/out/qemu-formatting-${{ matrix.firmware }}/
